services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://earnings_engine:earnings_engine_dev@db:5432/earnings_engine
      - ENVIRONMENT=production
      - API_AUTH_REQUIRED=true
      - ECE_API_KEY=${ECE_API_KEY:?Set ECE_API_KEY in .env before starting Docker Compose}
    volumes:
      - backend_data:/app/data
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_ECE_API_KEY=${ECE_API_KEY:?Set ECE_API_KEY in .env before starting Docker Compose}
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: earnings_engine
      POSTGRES_PASSWORD: earnings_engine_dev
      POSTGRES_DB: earnings_engine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earnings_engine"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  backend_data:
